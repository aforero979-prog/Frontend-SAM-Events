<div class="login-wrapper">

  <!-- Scanner frame corners -->
  <span class="corner tl"></span>
  <span class="corner tr"></span>
  <span class="corner bl"></span>
  <span class="corner br"></span>

  <!-- Header del panel -->
  <div class="panel-header">
    <span class="brand">S.A.M.</span>
    <span class="badge">PORTAL CLASIFICADO</span>
  </div>

  <h2 class="panel-title">IDENTIFICACIÓN</h2>
  <p class="panel-desc">Ingresa tus credenciales para acceder a los Expedientes del Círculo.</p>

  <form class="login-form" [formGroup]="formData" (ngSubmit)="onSubmit()">
    <div class="field">

      <label class="field-label" for="email">Email</label>
      <input class="field-input" formControlName="email" type="email" id="email" placeholder="Ej: xxxxxx@correo.com">

    </div>

    <div class="field">
      <label class="field-label" for="password">Clave de Encriptación</label>
      <input class="field-input" type="password" id="password" placeholder="••••••••" formControlName="password">
    </div>

    @if (errorMsg) {
      <p style="color:#ff4444;font-size:12px;margin:4px 0;">{{ errorMsg }}</p>
    }

    <button class="btn-submit" type="submit" [disabled]="formData.invalid">
      DESCIFRAR ACCESO →
    </button>
  </form>

  <div class="panel-footer">
    <span class="footer-text">¿No tienes acceso?</span>
    <a class="footer-link" routerLink="/register">Solicitar ingreso al Círculo</a>
  </div>

</div>
