<div class="login-wrapper">

  <!-- Scanner frame corners -->
  <span class="corner tl"></span>
  <span class="corner tr"></span>
  <span class="corner bl"></span>
  <span class="corner br"></span>

  <!-- Header del panel -->
  <div class="panel-header">
    <span class="brand">S.A.M.</span>
    <span class="badge">PORTAL CLASIFICADO</span>
  </div>

  <h2 class="panel-title">IDENTIFICACIÓN</h2>
  <p class="panel-desc">Ingresa tus credenciales para acceder a los Expedientes del Círculo.</p>

  <form class="login-form">
    <div class="field">
      <label class="field-label" for="alias">Alias / Frecuencia</label>
      <input class="field-input" type="text" id="alias" placeholder="Ej: V0ID_USER">
    </div>

    <div class="field">
      <label class="field-label" for="password">Clave de Encriptación</label>
      <input class="field-input" type="password" id="password" placeholder="••••••••">
    </div>

    <button class="btn-submit" type="submit">
      DESCIFRAR ACCESO →
    </button>
  </form>

  <div class="panel-footer">
    <span class="footer-text">¿No tienes acceso?</span>
    <a class="footer-link" href="#">Solicitar ingreso al Círculo</a>
  </div>

</div>
