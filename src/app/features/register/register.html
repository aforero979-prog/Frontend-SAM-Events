<h1 class="titulo" >Regístrate</h1>

<form [formGroup]="formData" (ngSubmit)="onSubmit()">

    <div class="field">
        <label for="name">Nombre:</label>
        <input type="text" formControlName="name" id="name" placeholder="Nombre" >
    </div>
    <div class="field">
        <label for="nit">Nit:</label>
        <input type="text" formControlName="nit" id="nit" placeholder="Nit">
    </div>
    <div class="field">
        <label for="email">Correo:</label>
        <input type="text" formControlName="email" id="email" placeholder="xxxxxx@correo.com">
    </div>
    <div class="field">
        <label for="password">Contraseña:</label>
        <input type="password" formControlName="password" id="password" placeholder="********">
    </div>
    <div class="field">
        <button>Registrarse</button>
    </div>

</form>
