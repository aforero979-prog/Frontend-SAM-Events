<div class="login-wrapper">

  <span class="corner tl"></span>
  <span class="corner tr"></span>
  <span class="corner bl"></span>
  <span class="corner br"></span>

  <div class="panel-header">
    <span class="brand">S.A.M.</span>
    <span class="badge">REGISTRO</span>
  </div>

  <h2 class="panel-title">NUEVO USUARIO</h2>
  <p class="panel-desc">Ingresa tus datos para registrarte en el sistema.</p>

  <form class="login-form" [formGroup]="formData" (ngSubmit)="onSubmit()">
    <div class="field">
      <label class="field-label" for="name">Nombre</label>
      <input class="field-input" type="text" formControlName="name" id="name" placeholder="Nombre completo">
    </div>
    <div class="field">
      <label class="field-label" for="email">Correo</label>
      <input class="field-input" type="email" formControlName="email" id="email" placeholder="xxxxxx@correo.com">
    </div>
    <div class="field">
      <label class="field-label" for="password">Contraseña</label>
      <input class="field-input" type="password" formControlName="password" id="password" placeholder="Mínimo 6 caracteres">
    </div>

    @if (successMsg) { <p style="color:#e8ff00;font-size:12px;margin:4px 0;">{{ successMsg }}</p> }
    @if (errorMsg)   { <p style="color:#ff4444;font-size:12px;margin:4px 0;">{{ errorMsg }}</p> }

    <button class="btn-submit" type="submit" [disabled]="formData.invalid">REGISTRARSE →</button>
  </form>
</div>

<!-- Modal de ÉXITO -->
@if (showSuccessModal) {
  <div class="modal-overlay">
    <div class="modal-box success">
      <h3 class="modal-title success">✔ ÉXITO</h3>
      <p class="modal-msg">El usuario ha sido registrado correctamente en el sistema.</p>
      <div class="modal-actions">
        <button class="btn-modal-close" (click)="closeModal()">CONTINUAR A LOGIN</button>
      </div>
    </div>
  </div>
}
