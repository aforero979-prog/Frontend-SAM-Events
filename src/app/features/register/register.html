<h1 class="titulo" >Regístrate</h1>

@if (successMsg) { <p style="color:green">{{ successMsg }}</p> }
@if (errorMsg)   { <p style="color:red">{{ errorMsg }}</p> }

<form [formGroup]="formData" (ngSubmit)="onSubmit()">

    <div class="field">
        <label for="name">Nombre:</label>
        <input type="text" formControlName="name" id="name" placeholder="Nombre">
    </div>
    <div class="field">
        <label for="email">Correo:</label>
        <input type="email" formControlName="email" id="email" placeholder="xxxxxx@correo.com">
    </div>
    <div class="field">
        <label for="password">Contraseña:</label>
        <input type="password" formControlName="password" id="password" placeholder="Mínimo 6 caracteres">
    </div>
    <div class="field">
        <button type="submit" [disabled]="formData.invalid">Registrarse</button>
    </div>

</form>
