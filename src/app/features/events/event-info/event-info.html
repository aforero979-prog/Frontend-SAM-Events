<div class="page">
    
    <div class="infoEvento">

        @if ( event$ | async; as event ) {

        <div class="evento">
            <img class="img-event" [alt]="event.name" [src]="event.imageUrl">
        </div>

        <h1 class="titulo">{{ event.name }}</h1>

        <p class="descripcion">{{ event.description}}</p>



        <div class="info">

            <p class="date">{{ event.initialDate }}</p>

            <p class="ciudad">{{ event.city }}</p>

            <p class="direccion">{{ event.direccion }}</p>

        </div>
