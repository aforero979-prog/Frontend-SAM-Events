<div class="conttitulo">
    <h1 class="titulo">PROXIMOS EVENTOS</h1>
</div>

<div class="eventos">

    @for (event of (eventList$ | async); track $index) {
    <div class="evento">

        <a [routerLink]="[ '/event-info', event._id]">
            <img class="img-event" [alt]="event.name" [src]="event.imageUrl">
        </a>

        <div class="descripcion">
            <h2>{{ event.name }}</h2>
            <p>{{ event.initialDate | date }}</p>
        </div>

        <div class="button">
            <a class="btn-accent" [routerLink]="[ '/event-info', event._id]">INFORMACIÓN DEL EVENTO</a>
        </div>

    </div>
    }


</div>
