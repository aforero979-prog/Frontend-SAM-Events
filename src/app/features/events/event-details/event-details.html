<h1 class="titulo">Comprar tickets:</h1>


<div class="infoEvento">

    @if ( event$ | async; as event ) {

    <div class="evento">
        <img class="img-event" [alt]="event.name" [src]="event.imageUrl">
    </div>
    }

</div>

<div class="modulodecompra">

    <div class="field">

        <label for="localidad">Localidad:</label>
        <select formControlName="localidad" id="localidad">

            <option value="">General</option>
            <option value="">VIP</option>
            <option value="">Backstage</option>

        </select>

        <div class="field1">
            <label for="ticket">Numero de entradas:</label>
            <select formControlName="ticket" id="ticket">

                <option value="">0</option>
                <option value="">1</option>
                <option value="">2</option>
                <option value="">3</option>
                <option value="">4</option>

            </select>
        </div>

        <div class="button">
            <a class="btn-accent" 
            /* [routerLink]="[ 'xxxxxxxxxxxxx', event._id]" */
            >COMPRAR</a>
        </div>

    </div>
