<div>
    <h2 class="Tittle2">Crear Nuevo Evento</h2>

    @if (successMsg) { <p style="color:green">{{ successMsg }}</p> }
    @if (errorMsg)   { <p style="color:red">{{ errorMsg }}</p> }
 
    <p>Diligencia los datos para crear un nuevo evento:</p>

    <form [formGroup]="formData" (ngSubmit)="onSubmit()" class="form form-Event">

        <div class="field">
            <label for="nameEvent">Nombre del evento:</label>
            <input type="text" placeholder="Nombre del evento" id="nameEvent" formControlName="name" required>
        </div>

        <div class="field">
            <label for="descriptionEvent">Descripción:</label>
            <input type="text" placeholder="Descripción del evento" id="descriptionEvent" formControlName="description">
        </div>

        <div class="field">
            <label for="priceTicket">Precio de la Boleta:</label>
            <input type="number" placeholder="Precio" id="priceTicket" formControlName="price" required>
        </div>

        <div class="field">
            <label for="stockTickets">Cantidad de Boletas:</label>
            <input type="number" placeholder="Cantidad" id="stockTickets" formControlName="stock" required>
        </div>

        <div class="field">
            <label for="eventDate">Fecha inicio del Evento:</label>
            <input type="datetime-local" id="eventDate" formControlName="initialDate" required>
        </div>

        <div class="field">
            <label for="eventDateFinish">Fecha fin del Evento:</label>
            <input type="datetime-local" id="eventDateFinish" formControlName="finalDate" required>
        </div>

        <div class="field">
            <label for="eventImage">URL Imagen del Evento:</label>
            <input type="text" placeholder="https://..." id="eventImage" formControlName="imageUrl">
        </div>

        <div class="field">
            <label for="category">Categoría:</label>
            <select id="category" formControlName="category" required>
                <option value="" disabled>Selecciona una categoría...</option>
                @for (cat of categories$ | async; track cat._id) {
                    <option [value]="cat._id">{{ cat.name }}</option>
                }
            </select>
        </div>

        <div class="Buttom">
            <button type="submit" [disabled]="formData.invalid">Crear Evento</button>
        </div>

    </form>

</div>
