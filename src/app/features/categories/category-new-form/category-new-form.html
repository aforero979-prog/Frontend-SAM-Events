<div class="page page-category"></div>

<h2>Registra la categoria:</h2>

<form class="form" [formGroup]="formData" (ngSubmit)="onSubmit()">

    <div class="field">
        <label for="category-name">Nombre de la categoria</label>
        <input type="text" formControlName="name" id="category-name">
    </div>

    <div class="field">
        <label for="category-description">Descripción:</label>
        <textarea formControlName="description" id="category-description"></textarea>
    </div>

    <div class="field">
        <label for="category-location">Ubicación:</label>
        <input type="text" formControlName="location" id="category-location">
    </div>

    <div class="field">
        <label for="">Status:</label>

        <div class="options">
            <input [value]="true" type="radio" formControlName="status" id="category-status-enable">
            <label for="category-status-enable">Activo</label>

            <input [value]="false" type="radio" formControlName="status" id="category-status-disable">
            <label for="category-status-disable">In-Activo</label>
        </div>
    </div>

    <div class="field">
        <button>Registrar categoria</button>
    </div>
