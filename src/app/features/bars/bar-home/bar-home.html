<h1 class="titulo">DESCUBRE CLUBS EN BOGOTÁ</h1>

<div class="bares">

    @for (bar of (barList$ | async); track $index) {
        <div class="bar">

            <div class="bar-name">
                <h2 class="name">{{ bar.name }}</h2>
            </div>

            <a [routerLink]="[ '/bar-info', bar._id]">
                <img [src]="bar.imageUrl" [alt]="bar.name" class="img-bar">
            </a>

            <div class="description">
                <p class="description">{{ bar.address }}, {{ bar.contactPhone }}</p>
            </div>
        </div>
    }
</div>
