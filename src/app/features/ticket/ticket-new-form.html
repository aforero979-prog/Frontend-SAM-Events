<div class="page page-ticket-form">

    <h2>Crea las boletas</h2>

    <form (ngSubmit)='onSubmit()' [formGroup]="formData" class="form">

        <div class="field">
            <label for="name">Nombre:</label>
            <input formControlName="name" type="text" placeholder="Nombre">
        </div>

        <div class="field">
            <label for="apellido">Apellido:</label>
            <input type="text" formControlName="apellido" id="apellido" placeholder="Apellido">
        </div>

        <div class="field">
            <label for="email">Email:</label>
            <input type="text" formControlName="email" id="email" placeholder="xxxxx@correo.com">
        </div>

          <div class="field">
            <label for="cedula">Documento de identidad:</label>
            <input type="text" formControlName="cedula" id="cedula" placeholder="Documento de identidad">
        </div>

        <div class="field">
            <label for="localidad">Ubicación</label>
            <select formControlName="localidad" id="localidad">

                <option value="">Ubicación...</option>
                <option value="">Back Stage</option>
                <option value="">VIP</option>
                <option value="">General</option>

            </select>

            <div class="field">
                <label for="stock">Número de ticket</label>
                <select formControlName="stock" id="stock">

                    <option value="">0</option>
                    <option value="">1</option>
                    <option value="">2</option>
                    <option value="">3</option>
                    <option value="">4</option>

                </select>
            </div>
        </div>

        <label for="localidad">Localidad:</label>
        <div class="options">
            <input formControlName="status" type="radio" [value]="true"><label for="categorie-status-enable">Activo</label>
            <input formControlName="status" type="radio" [value]="false"><label for="categorie-status-disable">InActivo</label>
        </div>

    </div>

    <div class="field">
        <label for="stock">Stock del Evento</label>
        <input type="number" formControlName="stock" id="stock">
    </div> -->

        <div class="button">
            <button>Comprar</button>
        </div>

    </form>

</div>
