<div class="compra">

  <h2>Crear Ticket</h2>

  @if (successMsg) { <p style="color:green">{{ successMsg }}</p> }
  @if (errorMsg)   { <p style="color:red">{{ errorMsg }}</p> }

  <form (ngSubmit)='onSubmit()' [formGroup]="formData" class="form">

    <div class="field">
      <label for="name">Nombre del ticket:</label>
      <input formControlName="name" type="text" id="name" placeholder="Ej: VIP, General, Back Stage">
    </div>

    <div class="field">
      <label for="price">Precio (COP):</label>
      <input type="number" formControlName="price" id="price" placeholder="0" min="0">
    </div>

    <div class="field">
      <label for="description">Descripción:</label>
      <input type="text" formControlName="description" id="description" placeholder="Descripción del ticket">
    </div>

    <div class="field">
      <label for="status">Estado:</label>
      <select formControlName="status" id="status">
        @for (s of statuses; track s) {
          <option [value]="s">{{ s }}</option>
        }
      </select>
    </div>

    <div class="field">
      <label for="stock">Stock (cantidad disponible):</label>
      <input type="number" formControlName="stock" id="stock" min="1">
    </div>

    <div class="button">
      <button type="submit" [disabled]="formData.invalid">Crear Ticket</button>
    </div>

  </form>

</div>
