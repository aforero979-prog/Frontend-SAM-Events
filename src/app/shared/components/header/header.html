<header class="site-header">

  <!-- Logo + location -->
  <div class="header-left">
    <a routerLink="/home" class="brand-logo" title="Sociedad Anónima de Música">S.A.M.</a>
    <div class="loc-chip">
      <span class="loc-icon">📍</span>
      <span class="loc-text">BOG · TERMINAL 01</span>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="nav-links">


    <a routerLink="/bares"    routerLinkActive="nav-active">CLUBES</a>
    <a routerLink="/events" routerLinkActive="nav-active">EVENTOS</a>
  </nav>

  <!-- Actions -->
  <div class="header-right">
    
    
    @if (!auth.isLoggedIn()) {
      <a routerLink="/login" class="btn-accent" routerLinkActive="nav-active">
        <span class="btn-txt">INICIAR SESIÓN</span>
        <span class="btn-plus">➜</span>
      </a>
    } @else {
      <div class="user-info">
        <span class="user-name">{{ (auth.currentUser$ | async)?.name || 'Usuario' }}</span>
        <span class="user-role">{{ (auth.currentUser$ | async)?.role || 'USER' }}</span>
      </div>
      <button class="btn-logout" (click)="logout()" title="Cerrar sesión">
        <span class="logout-icon">⏻</span>
        <span class="logout-txt">SALIR</span>
      </button>
    }
  </div>

</header>
