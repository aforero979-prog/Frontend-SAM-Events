<header class="site-header">

  <!-- Logo + location -->
  <div class="header-left">
    <a routerLink="/home" class="brand-logo" title="Sociedad Anónima de Música">S.A.M.</a>
    <div class="loc-chip">
      <span class="loc-icon">📍</span>
      <span class="loc-text">BOG · TERMINAL 01</span>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="nav-links">


    <a routerLink="/festivales"    routerLinkActive="nav-active">CLUBES</a>
    <a routerLink="/login"   routerLinkActive="nav-active">INICIAR SESIÓN</a>
    <a routerLink="/events" routerLinkActive="nav-active">EVENTOS</a>

    // TODO: Revisar como condicionar el despliegue de estos botones
    <!-- @if (!auth.isLoggedIn()) {
      <a routerLink="/login" routerLinkActive="nav-active">INICIAR SESIÓN</a>
    }
    @if (auth.isLoggedIn()) {
      <a routerLink="/dashboard" routerLinkActive="nav-active">PANEL</a>
    } -->

  </nav>

  <!-- Actions -->
  <div class="header-right">
    @if (!auth.isLoggedIn()) {
      <a routerLink="/login"    class="btn-ghost">PORTAL</a>
      <a routerLink="/register" class="btn-accent">
        <span class="btn-txt">NUEVA CONVOCATORIA</span>
        <span class="btn-plus">+</span>
      </a>
    }
    @if (auth.isLoggedIn()) {
      <span class="user-name">{{ (auth.currentUser$ | async)?.name || 'Usuario' }}</span>
      <button class="btn-logout" (click)="logout()" title="Cerrar sesión">
        <span class="logout-icon">⏻</span>
        <span class="logout-txt">SALIR</span>
      </button>
    }
  </div>

</header>
